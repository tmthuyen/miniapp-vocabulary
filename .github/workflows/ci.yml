name: CI

on: 
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]


jobs:
  # Job 1: Build and Test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # - run: npm run lint
      - run: npm run test
      - run: npm run build

